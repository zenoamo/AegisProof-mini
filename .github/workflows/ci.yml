name: aegisproof-mini

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: install
        run: npm ci

      - name: committed key binding
        run: npm run keys:check

      # Do not run npm run build. It would replace the committed 0.1.0 zkey and verification key.
      - name: Sepolia local tests
        run: npm run sepolia:test

      - name: test
        run: |
          npm run test:positive
          node --test --test-force-exit tests/cli/cli.test.js tests/isolation.test.js

      - name: negative test
        run: npm run test:negative

      - name: tamper and authenticity
        run: |
          npm run test:tamper
          npm run test:authenticity

      - name: artifact integrity test
        run: npm run integrity

      - name: generations, local boundary, and frozencore
        run: |
          node --test --test-force-exit "tests/foundation/**/*.test.js" "tests/protocol/**/*.test.js" "tests/protection/**/*.test.js"
          npm run test:local-tee
          npm run test:mini-0.2.0
          npm run test:frozencore
