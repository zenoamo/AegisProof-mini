name: frozencore experimental

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-frozencore:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: install
        run: npm ci

      - name: Frozen Core development tests
        run: npm run test:frozencore
